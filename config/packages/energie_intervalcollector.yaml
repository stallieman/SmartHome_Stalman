input_text:
  stalman_finance_session:
    name: Stalman collector HA sessie
    max: 64
    initial: ''
shell_command:
  stalman_finance_collect: python3 /config/energy_finance/collector.py --config /config/energy_finance/collector.json
    --database /config/energy_finance/intervals.sqlite --output /config/energy_finance/observations.json --sample-url
    "{{ snapshot | to_json | urlencode }}"
automation:
- id: stalman_finance_collect
  alias: Stalman financiële meetintervallen
  mode: queued
  max: 10
  triggers:
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: time_pattern
    seconds: /10
    id: sample
  - trigger: state
    entity_id: sensor.p1_meter_tarief
    id: tariff
  actions:
  - if: '{{ trigger.id == ''startup'' }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.stalman_finance_session
      data:
        value: '{{ now().isoformat() }}'
  - condition: template
    value_template: "{{ trigger.id != 'sample' or states('input_text.stalman_finance_session') != '' }}"
  - variables:
      snapshot: "{% set ns = namespace(items=[]) %}\n{% for entity in ['sensor.p1_meter_energie_import', 'sensor.p1_meter_energie_export',\
        \ 'sensor.p1_meter_energie_import_tarief_1', 'sensor.p1_meter_energie_import_tarief_2', 'sensor.p1_meter_energie_export_tarief_1',\
        \ 'sensor.p1_meter_energie_export_tarief_2', 'sensor.marstek_venus_e_5_12kwh_3nd_gen_simulated_sensor_p1_meter_energie_import',\
        \ 'sensor.marstek_venus_e_5_12kwh_3nd_gen_simulated_sensor_p1_meter_energie_export', 'sensor.p1_meter_tarief']\
        \ %}\n  {% set s = states[entity] %}\n  {% if s is defined and s is not none %}\n    {% set item = {'state':\
        \ s.state, 'unit': s.attributes.get('unit_of_measurement'),\n                   'last_reported': s.last_reported.isoformat(),\
        \ 'last_updated': s.last_updated.isoformat(), 'last_changed': s.last_changed.isoformat(),\n            \
        \       'last_reset': s.attributes.get('last_reset'), 'restored': s.attributes.get('restored', false)} %}\n\
        \  {% else %}\n    {% set item = {'state': 'unavailable', 'restored': true} %}\n  {% endif %}\n  {% set\
        \ ns.items = ns.items + [(entity, item)] %}\n{% endfor %}\n{{ {'captured_at': now().isoformat(), 'session':\
        \ states('input_text.stalman_finance_session'), 'states': dict(ns.items)} }}"
  - action: shell_command.stalman_finance_collect
    data:
      snapshot: '{{ snapshot }}'
    response_variable: collection_result
  - if: '{{ collection_result.returncode != 0 }}'
    then:
    - stop: Collector heeft geen geldige financiële invoer gemaakt; controleer instellingen en meetkwaliteit.
      error: true
