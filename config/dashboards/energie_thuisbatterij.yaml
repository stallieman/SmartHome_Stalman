title: Energie & Thuisbatterij · YAML
views:
- title: Overzicht
  path: energie
  icon: mdi:home-lightning-bolt
  type: sections
  max_columns: 2
  theme: Stalman Nacht
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Actueel
      icon: mdi:flash
    - type: markdown
      content: 'Huis · berekend


        {% set v = states(''sensor.stalman_woningvermogen'') %}

        {% if is_number(v) %}

        # {{ (v | float * 1) | round(0) }} W

        {% else %}

        **Nog niet beschikbaar**

        {% endif %}'
      grid_options:
        columns: 6
        rows: auto
    - type: markdown
      content: 'Net · + afname / − teruglevering


        {% set v = states(''sensor.p1_meter_vermogen'') %}

        {% if is_number(v) %}

        # {{ (v | float * 1) | round(0) }} W

        {% else %}

        **Nog niet beschikbaar**

        {% endif %}'
      grid_options:
        columns: 6
        rows: auto
    - type: markdown
      content: 'Zonnepanelen


        {% set v = states(''sensor.stalman_total_output_power'') %}

        {% if is_number(v) %}

        # {{ (v | float * 1) | round(0) }} W

        {% else %}

        **Nog niet beschikbaar**

        {% endif %}'
      grid_options:
        columns: 6
        rows: auto
    - type: markdown
      content: 'Marstek · simulatie


        {% set v = states(''sensor.marstek_venus_e_5_12kwh_3nd_gen_state_of_charge'') %}

        {% if is_number(v) %}

        # {{ (v | float * 1) | round(0) }} %

        {% else %}

        **Nog niet beschikbaar**

        {% endif %}

        {% set c = states(''sensor.marstek_venus_e_5_12kwh_3nd_gen_current_charging_rate'') %}

        {% set u = states(''sensor.marstek_venus_e_5_12kwh_3nd_gen_current_discharging_rate'') %}

        {% if is_number(c) and is_number(u) %}

        Laden {{ (c | float * 1000) | round(0) }} W · Ontladen {{ (u | float * 1000) | round(0) }} W

        {% else %}

        Laadvermogen nog niet beschikbaar

        {% endif %}'
      grid_options:
        columns: 6
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Vandaag
      icon: mdi:calendar-today
    - type: markdown
      content: 'Huisverbruik


        {% set v = states(''sensor.stalman_huis_vandaag'') %}

        {% if is_number(v) %}

        # {{ (v | float * 1) | round(2) }} kWh

        {% else %}

        **Nog niet beschikbaar**

        {% endif %}'
      grid_options:
        columns: 6
        rows: auto
    - type: markdown
      content: 'Netafname


        {% set v = states(''sensor.stalman_import_vandaag'') %}

        {% if is_number(v) %}

        # {{ (v | float * 1) | round(2) }} kWh

        {% else %}

        **Nog niet beschikbaar**

        {% endif %}'
      grid_options:
        columns: 6
        rows: auto
    - type: markdown
      content: 'Teruglevering


        {% set v = states(''sensor.stalman_export_vandaag'') %}

        {% if is_number(v) %}

        # {{ (v | float * 1) | round(2) }} kWh

        {% else %}

        **Nog niet beschikbaar**

        {% endif %}'
      grid_options:
        columns: 6
        rows: auto
    - type: markdown
      content: 'Batterijbesparing · simulatie


        {% set v = states(''sensor.stalman_batterijbesparing_vandaag'') %}

        {% if is_number(v) %}

        # {{ (v | float * 1) | round(2) }} €

        {% else %}

        **Nog niet beschikbaar**

        {% endif %}'
      grid_options:
        columns: 6
        rows: auto
    - type: markdown
      content: 'Dagmeters: eerste dag vanaf installatie.'
      text_only: true
      grid_options:
        columns: 12
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Energiestromen · vandaag
      icon: mdi:transmission-tower
    - type: energy-distribution
      collection_key: energy_stalman_overzicht
      link_dashboard: false
  - type: grid
    cards:
    - type: heading
      heading: Verbruik · vandaag
      icon: mdi:chart-line
    - type: energy-usage-graph
      collection_key: energy_stalman_overzicht
- title: Simulatie
  path: simulatie
  icon: mdi:battery-clock
  type: sections
  max_columns: 3
  theme: Stalman Nacht
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Virtuele Marstek
      icon: mdi:flask-outline
    - type: markdown
      content: '## SIMULATIE

        Marstek Venus E 3.0 · 5,12 kWh


        Geen fysieke thuisbatterij. Deze waarden wijzigen de werkelijke P1-metingen niet.


        Ontwerp: laden 2,5 kW · ontladen 0,8 kW · SoC 10–100% · circa 91% efficiëntie per richting. Controleer de
        actieve simulatorinstellingen.'
    - type: gauge
      entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_state_of_charge
      name: Virtuele batterijlading
      min: 0
      max: 100
      needle: true
      severity:
        red: 0
        yellow: 10
        green: 30
    - type: tile
      entity: sensor.marstek_venus_e_5_12kwh_3nd_gen
      name: Opgeslagen energie
      tap_action:
        action: more-info
      icon: mdi:battery
      color: green
    - type: tile
      entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_battery_mode_now
      name: Simulatorstatus
      tap_action:
        action: more-info
      icon: mdi:flask-outline
  - type: grid
    cards:
    - type: heading
      heading: Laden & ontladen
      icon: mdi:battery-charging
    - type: tile
      entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_current_charging_rate
      name: Laadvermogen · simulatie
      tap_action:
        action: more-info
      icon: mdi:battery-arrow-up
      color: blue
    - type: tile
      entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_current_discharging_rate
      name: Ontlaadvermogen · simulatie
      tap_action:
        action: more-info
      icon: mdi:battery-arrow-down
      color: green
    - type: history-graph
      title: Vermogen · 24 uur
      hours_to_show: 24
      entities:
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_current_charging_rate
        name: Laden (kW)
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_current_discharging_rate
        name: Ontladen (kW)
    - type: entities
      title: Sinds start / laatste reset
      show_header_toggle: false
      entities:
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_battery_energy_in
        name: Geladen energie
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_battery_energy_out
        name: Ontladen energie
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_total_energy_saved
        name: Bespaarde netafname
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_battery_cycles
        name: Batterijcycli
  - type: grid
    cards:
    - type: heading
      heading: Batterijverloop
      icon: mdi:chart-areaspline
    - type: history-graph
      title: Batterijlading · 24 uur
      hours_to_show: 24
      entities:
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_state_of_charge
        name: SoC (%)
    - type: statistics-graph
      title: SoC · afgelopen 7 dagen
      chart_type: line
      period: hour
      days_to_show: 7
      stat_types:
      - mean
      - min
      - max
      entities:
      - sensor.marstek_venus_e_5_12kwh_3nd_gen_state_of_charge
    - type: markdown
      content: Historie verschijnt alleen als Recorder deze sensoren registreert. Simulator-totalen gelden sinds
        start of reset; ze zijn geen levenslange fysieke meterstanden. Er staan geen reset- of bedieningsknoppen
        op dit dashboard.
- title: Analyse
  path: analyse
  icon: mdi:chart-box-outline
  type: sections
  max_columns: 3
  theme: Stalman Nacht
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Zonder & met batterij
      icon: mdi:compare-horizontal
    - type: markdown
      content: '## Gemeten versus gesimuleerd

        Vergelijk veranderingen binnen hetzelfde tijdvenster. Absolute meterstanden kunnen een andere beginwaarde
        hebben. De grafiek toont dagelijkse toenames; de huidige dag en de eerste simulatiedag zijn onvolledig.'
    - type: statistics-graph
      title: Netafname per dag · 14 dagen
      chart_type: bar
      period: day
      days_to_show: 14
      stat_types:
      - change
      entities:
      - entity: sensor.p1_meter_energie_import
        name: Zonder batterij · P1
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_simulated_sensor_p1_meter_energie_import
        name: Met batterij · simulatie
    - type: tile
      entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_total_energy_saved
      name: Bespaarde netafname · simulatie
      tap_action:
        action: more-info
      icon: mdi:transmission-tower-off
      color: green
    - type: entities
      title: Referentiemeterstanden
      show_header_toggle: false
      entities:
      - entity: sensor.p1_meter_energie_import
        name: Werkelijke import
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_simulated_sensor_p1_meter_energie_import
        name: Gesimuleerde import
      - entity: sensor.p1_meter_energie_export
        name: Werkelijke export
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_simulated_sensor_p1_meter_energie_export
        name: Gesimuleerde export
  - type: grid
    cards:
    - type: heading
      heading: Kostenvergelijking · schatting
      icon: mdi:currency-eur
    - type: markdown
      content: 'Op gemeten netenergie, met virtuele batterij als simulatie. Zonder bevestigde contractgegevens en
        gelijktijdige meetwaarden: **Nog niet beschikbaar**.'
    - type: tile
      entity: sensor.stalman_besparingsscenario
      name: Periodebesparing · simulatie
      tap_action:
        action: more-info
      icon: mdi:calculator
      color: green
    - type: entities
      title: Volledige afrekening · geselecteerd jaar
      show_header_toggle: false
      entities:
      - entity: sensor.stalman_afrekening_kosten_zonder_batterij
        name: Variabele kosten · zonder batterij
      - entity: sensor.stalman_afrekening_kosten_met_simulatie
        name: Variabele kosten · met simulatie
      - entity: sensor.stalman_besparingsscenario
        name: Verschil · variabele kosten
      - entity: sensor.stalman_totaal_afrekening_zonder_batterij
        name: Totale kosten incl. vaste kosten · zonder batterij
      - entity: sensor.stalman_totaal_afrekening_met_simulatie
        name: Totale kosten incl. vaste kosten · met simulatie
    - type: markdown
      content: Een afrekening gebruikt de contract- en meetperiode uit de financiële invoer. Vaste kosten worden
        alleen aan totalen toegevoegd als bedrag, btw-basis en geldigheidsduur bevestigd zijn; ze worden nooit
        als batterijbesparing geteld. De Marstek-uitkomst blijft een simulatie.
    - type: markdown
      content: '**Terugverdientijd: nog niet beschikbaar.**'
    - type: entities
      title: Vandaag · gemeten basis versus simulatie
      show_header_toggle: false
      entities:
      - entity: sensor.stalman_kosten_zonder_batterij_vandaag
        name: Zonder batterij · geschatte kosten
      - entity: sensor.stalman_kosten_met_batterij_vandaag
        name: Met virtuele batterij · geschatte kosten
      - entity: sensor.stalman_batterijbesparing_vandaag
        name: Verschil · simulatie
    - type: markdown
      content: '{% if not is_state(''sensor.stalman_financiele_vergelijking'', ''ok'') %}

        **Nog niet beschikbaar**


        {{ state_attr(''sensor.stalman_financiele_vergelijking'', ''reason'') or ''Contractgegevens en gekoppelde
        meetperiode ontbreken.'' }}

        {% endif %}'
    - type: entities
      title: Gecertificeerd meetvenster · schatting
      show_header_toggle: false
      entities:
      - entity: sensor.stalman_meetvenster_zonder
        name: Zonder batterij · gemeten basis
      - entity: sensor.stalman_meetvenster_met
        name: Met virtuele batterij · simulatie
      - entity: sensor.stalman_meetvenster_verschil
        name: Financieel verschil · simulatie
    - type: markdown
      content: '{% if is_state(''sensor.stalman_financiele_vergelijking'', ''ok'') and state_attr(''sensor.stalman_financiele_vergelijking'',
        ''scope'') == ''window'' %}

        **Alleen dit meetvenster:**


        {{ state_attr(''sensor.stalman_financiele_vergelijking'', ''measured_from'') }} → {{ state_attr(''sensor.stalman_financiele_vergelijking'',
        ''observed_until'') }}


        Geen volledige dag of jaarrekening.

        {% else %}

        **Gecertificeerd meetvenster: nog niet beschikbaar.**

        {% endif %}'
  - type: grid
    cards:
    - type: heading
      heading: Contract & rekenregels
      icon: mdi:file-document-check-outline
    - type: markdown
      content: 'Tarieven en ingangsdatums: `energy_finance/tariffs.json`. Meetperiode: `energy_finance/observations.json`.


        10% korting geldt uitsluitend voor levering. Tot 2027 is jaarlijkse saldering nodig; daarom geen dagelijkse
        besparing vóór de ingangsdatum. Zie de financiële handleiding.'
