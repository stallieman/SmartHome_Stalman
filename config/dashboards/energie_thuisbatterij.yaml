      content: 'Huis · berekend


        {% set v = states(''sensor.stalman_woningvermogen'') %}

        {% if is_number(v) %}

        # {{ (v | float * 1) | round(0) }} W

        {% else %}

        **Nog niet beschikbaar**

        {% endif %}'
      grid_options:
        columns: 6
        rows: auto
    - type: markdown
      content: 'Net · + afname / − teruglevering


        {% set v = states(''sensor.p1_meter_vermogen'') %}

        {% if is_number(v) %}

        # {{ (v | float * 1) | round(0) }} W

        {% else %}

        **Nog niet beschikbaar**

        {% endif %}'
      grid_options:
        columns: 6
        rows: auto
    - type: markdown
