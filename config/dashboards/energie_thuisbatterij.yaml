- title: Simulatie
  path: simulatie
  icon: mdi:battery-clock
  type: sections
  max_columns: 3
  theme: Stalman Nacht
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Virtuele Marstek
      icon: mdi:flask-outline
    - type: markdown
      content: '## SIMULATIE

        Marstek Venus E 3.0 · 5,12 kWh


        Geen fysieke thuisbatterij. Deze waarden wijzigen de werkelijke P1-metingen niet.


        Ontwerp: laden 2,5 kW · ontladen 0,8 kW · SoC 10–100% · circa 91% efficiëntie per richting. Controleer de
        actieve simulatorinstellingen.'
    - type: gauge
      entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_state_of_charge
      name: Virtuele batterijlading
      min: 0
      max: 100
      needle: true
      severity:
        red: 0
        yellow: 10
        green: 30
    - type: tile
      entity: sensor.marstek_venus_e_5_12kwh_3nd_gen
      name: Opgeslagen energie
      tap_action:
        action: more-info
      icon: mdi:battery
      color: green
    - type: tile
      entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_battery_mode_now
      name: Simulatorstatus
      tap_action:
        action: more-info
      icon: mdi:flask-outline
  - type: grid
    cards:
    - type: heading
      heading: Laden & ontladen
      icon: mdi:battery-charging
    - type: tile
      entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_current_charging_rate
      name: Laadvermogen · simulatie
      tap_action:
        action: more-info
      icon: mdi:battery-arrow-up
      color: blue
    - type: tile
      entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_current_discharging_rate
      name: Ontlaadvermogen · simulatie
      tap_action:
        action: more-info
      icon: mdi:battery-arrow-down
      color: green
    - type: history-graph
      title: Vermogen · 24 uur
      hours_to_show: 24
      entities:
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_current_charging_rate
        name: Laden (kW)
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_current_discharging_rate
        name: Ontladen (kW)
    - type: entities
      title: Sinds start / laatste reset
      show_header_toggle: false
      entities:
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_battery_energy_in
        name: Geladen energie
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_battery_energy_out
        name: Ontladen energie
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_total_energy_saved
        name: Bespaarde netafname
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_battery_cycles
        name: Batterijcycli
  - type: grid
    cards:
    - type: heading
      heading: Batterijverloop
      icon: mdi:chart-areaspline
    - type: history-graph
      title: Batterijlading · 24 uur
      hours_to_show: 24
      entities:
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_state_of_charge
        name: SoC (%)
    - type: statistics-graph
      title: SoC · afgelopen 7 dagen
      chart_type: line
      period: hour
      days_to_show: 7
      stat_types:
      - mean
      - min
      - max
      entities:
      - sensor.marstek_venus_e_5_12kwh_3nd_gen_state_of_charge
    - type: markdown
      content: Historie verschijnt alleen als Recorder deze sensoren registreert. Simulator-totalen gelden sinds
        start of reset; ze zijn geen levenslange fysieke meterstanden. Er staan geen reset- of bedieningsknoppen
        op dit dashboard.
- title: Analyse
  path: analyse
  icon: mdi:chart-box-outline
  type: sections
  max_columns: 3
  theme: Stalman Nacht
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Zonder & met batterij
      icon: mdi:compare-horizontal
    - type: markdown
      content: '## Gemeten versus gesimuleerd

        Vergelijk veranderingen binnen hetzelfde tijdvenster. Absolute meterstanden kunnen een andere beginwaarde
        hebben. De grafiek toont dagelijkse toenames; de huidige dag en de eerste simulatiedag zijn onvolledig.'
    - type: statistics-graph
      title: Netafname per dag · 14 dagen
      chart_type: bar
      period: day
      days_to_show: 14
      stat_types:
      - change
      entities:
      - entity: sensor.p1_meter_energie_import
        name: Zonder batterij · P1
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_simulated_sensor_p1_meter_energie_import
        name: Met batterij · simulatie
    - type: tile
      entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_total_energy_saved
      name: Vermeden netafname · simulatie
      tap_action:
        action: more-info
      icon: mdi:transmission-tower-off
      color: green
    - type: entities
      title: Referentiemeterstanden
      show_header_toggle: false
      entities:
      - entity: sensor.p1_meter_energie_import
        name: Werkelijke import
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_simulated_sensor_p1_meter_energie_import
        name: Gesimuleerde import
      - entity: sensor.p1_meter_energie_export
        name: Werkelijke export
      - entity: sensor.marstek_venus_e_5_12kwh_3nd_gen_simulated_sensor_p1_meter_energie_export
        name: Gesimuleerde export
  - type: grid
    cards:
    - type: markdown
      content: |-
        ### Indicatieve 2027-simulatie
        Laatste 14 dagen · 336 uur

        {% set entity = 'sensor.stalman_indicatieve_simulatie_2027_14_dagen' %}
        {% set end = as_timestamp(state_attr(entity, 'period_end'), 0) %}
        {% set ready = is_state(entity, 'ok') and 0 <= as_timestamp(now()) - end <= 900 and is_number(state_attr(entity, 'without_eur')) and is_number(state_attr(entity, 'with_eur')) and is_number(state_attr(entity, 'saving_eur')) and is_number(state_attr(entity, 'valid_hours')) and is_number(state_attr(entity, 'coverage_percent')) %}
        | | |
        |:--|--:|
        | Zonder batterij | {{ '€ ' ~ (state_attr(entity, 'without_eur') | string | replace('.', ',')) if ready else '—' }} |
        | Met batterij | {{ '€ ' ~ (state_attr(entity, 'with_eur') | string | replace('.', ',')) if ready else '—' }} |
        | **Besparing** | **{{ '€ ' ~ (state_attr(entity, 'saving_eur') | string | replace('.', ',')) if ready else '—' }}** |
        | Geldige meeturen | {{ (state_attr(entity, 'valid_hours') | string | replace('.', ',')) ~ ' uur' if ready else '—' }} |
        | Meetdekking | {{ (state_attr(entity, 'coverage_percent') | string | replace('.', ',')) ~ '%' if ready else '—' }} |

        {% if not ready %}
        Er zijn nog geen recente, gevalideerde bedragen voor dit meetvenster.
        {% endif %}
        Bedragen gelden alleen voor gevalideerde meeturen, met de bestaande 2027-aannames.
      entity_id:
        - sensor.stalman_indicatieve_simulatie_2027_14_dagen
      grid_options:
        columns: 12
        rows: auto
  - type: grid
    cards:
    - type: heading
      heading: Contract & rekenregels
      icon: mdi:file-document-check-outline
    - type: markdown
      content: 'Tarieven en ingangsdatums: `energy_finance/tariffs.json`. Meetperiode: `energy_finance/observations.json`.


        10% korting geldt uitsluitend voor levering. Tot 2027 is jaarlijkse saldering nodig; daarom geen dagelijkse
        besparing vóór de ingangsdatum. Zie de financiële handleiding.'
